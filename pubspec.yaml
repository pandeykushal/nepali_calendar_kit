name: nepali_calendar_kit
description: >-
  Material 3 Bikram Sambat (BS) calendar and date picker toolkit for Flutter:
  pickers, range and multi-date selection, events, and a built-in BS/AD engine.
version: 0.2.1
repository: https://github.com/pandeykushal/nepali_calendar_kit
homepage: https://github.com/pandeykushal/nepali_calendar_kit
issue_tracker: https://github.com/pandeykushal/nepali_calendar_kit/issues
topics:
  - nepali
  - calendar
  - date-picker
  - bikram-sambat
  - localization

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # No third-party runtime dependencies — the BS engine is built in.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
